<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>豆子实验室 · md 转公众号排版（单文件版）</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f4f1ea; color: #2b2320; }
  header { background: #191919; color: #fff; padding: 14px 20px; }
  header b { letter-spacing: 2px; } header span { color: #e0655f; margin-left: 10px; font-size: 13px; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .col { flex: 1 1 420px; min-width: 320px; }
  textarea { width: 100%; height: 430px; box-sizing: border-box; font-family: Consolas, Menlo, monospace; font-size: 13px; line-height: 1.6; padding: 10px; border: 1.5px solid #d8cfc2; border-radius: 8px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  button { background: #c73e3a; color: #fff; border: none; padding: 9px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button.ghost { background: #fff; color: #c73e3a; border: 1.5px solid #c73e3a; }
  select { padding: 8px; border-radius: 6px; border: 1.5px solid #d8cfc2; font-size: 14px; }
  #preview { background: #fff; border: 1.5px solid #d8cfc2; border-radius: 8px; padding: 22px; min-height: 430px; overflow: auto; }
  #status { font-size: 13px; color: #3e7c4f; min-height: 18px; }
  .hint { font-size: 13px; color: #777; line-height: 1.7; }
  #strip { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .cell { width: 150px; background: #fff; border: 1.5px solid #d8cfc2; border-radius: 8px; padding: 8px; text-align: center; }
  .cell img { max-width: 100%; border-radius: 4px; }
  .cell .num { font-weight: 700; color: #c73e3a; font-size: 16px; margin-bottom: 6px; }
  .cell .fname { font-size: 11px; color: #666; word-break: break-all; margin: 6px 0; }
  .cell .missing { height: 84px; display: flex; align-items: center; justify-content: center; background: #fdf1f0; color: #b03028; font-size: 12px; border-radius: 4px; padding: 4px; word-break: break-all; }
  .cell a { font-size: 12px; color: #c73e3a; }
  h3 { margin: 18px 0 6px; }
</style>
</head>
<body>
<header><b>豆子实验室</b><span>md 转公众号排版 · 单文件版（离线可用）</span></header>
<main>
  <div class="row">
    <div class="col">
      <h3>1 粘贴 Markdown</h3>
      <textarea id="md" placeholder="把渣渣给你的 .md 全文粘贴到这里（第一行 # 标题）"></textarea>
      <div class="bar">
        <select id="theme"></select>
        <label style="font-size:13px"><input type="checkbox" id="furniture" checked> 品牌头条+文末署名</label>
      </div>
      <div class="bar">
        <label style="font-size:13px">配图（可多选，把图包里的图全选进来）：<input type="file" id="files" multiple accept="image/*"></label>
      </div>
      <div class="bar">
        <button id="gen">生成预览</button>
        <button id="copy" class="ghost">复制到公众号</button>
        <span id="status"></span>
      </div>
      <p class="hint">用法：粘 md → 选主题 → 生成预览 → 点“复制到公众号” → 去公众号编辑器粘贴正文 → 按下方编号顺序把图片逐张传到对应位置（微信不允许图片跟着粘贴走，这一步省不掉，但编号就是顺序）。<br>与管线版的唯一差别：代码块没有语法高亮着色（底色和排版都在），其余效果一致。</p>
    </div>
    <div class="col">
      <h3>2 预览（即公众号效果）</h3>
      <div id="preview"><p class="hint">预览会显示在这里。</p></div>
    </div>
  </div>
  <h3>3 配图顺序（发布时按编号上传）</h3>
  <div id="strip"><p class="hint">生成预览后，这里会按文章里的出现顺序列出每张图。</p></div>
</main>
<script>

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function applyMarkSyntax(md){
  const lines = md.split('\n'); let inFence = false;
  return lines.map((line)=>{
    if(line.trimStart().startsWith('\`\`\`')) inFence = !inFence;
    if(inFence) return line;
    return line.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
  }).join('\n');
}

  },
  image(token){
    const alt = token.text ? ' alt="' + escapeHtml(token.text) + '"' : '';

  },
  heading(token){
    const inner = this.parser.parseInline(token.tokens);

  },

}});

  css = css.replace(/\/\*[\s\S]*?\*\//g, '');
  css = css.replace(/@media[^{]*\{(?:[^{}]*\{[^{}]*\})*[^{}]*\}/g, '');
  const rules = []; const re = /([^{}]+)\{([^{}]*)\}/g; let m; let order = 0;
  while((m = re.exec(css))){
    const decls = m[2].split(';').map(s=>s.trim()).filter(Boolean).map(d=>{
      const i = d.indexOf(':'); return [d.slice(0, i).trim(), d.slice(i + 1).trim()];
    }).filter(d=>d[0] && d[1]);
    for(const sel of m[1].split(',').map(s=>s.trim()).filter(Boolean)){
      rules.push({ chain: sel.split(/\s+/), decls, order: order++ });
    }
  }
  return rules;
}
function matchSimple(el, simple){
  const parts = simple.split('.'); const tag = parts[0];
  if(tag && tag !== '*' && el.tagName.toLowerCase() !== tag.toLowerCase()) return false;
  const cls = (el.getAttribute('class') || '').split(/\s+/);
  for(let i = 1; i < parts.length; i++) if(parts[i] && !cls.includes(parts[i])) return false;
  return true;
}
function matchChain(el, chain){
  if(!matchSimple(el, chain[chain.length - 1])) return false;
  let anc = el.parentElement; let i = chain.length - 2;
  while(i >= 0){
    while(anc && !matchSimple(anc, chain[i])) anc = anc.parentElement;
    if(!anc) return false;
    anc = anc.parentElement; i--;
  }
  return true;
}
function specificity(chain){
  let c = 0, t = 0;
  for(const s of chain){ const p = s.split('.'); if(p[0] && p[0] !== '*') t++; c += p.length - 1; }
  return c * 100 + t;
}
function inlineStyles(root, css){
  const rules = parseCss(css);
  const els = [root].concat(Array.from(root.querySelectorAll('*')));
  for(const el of els){
    const matched = rules.filter(r => matchChain(el, r.chain));
    if(!matched.length) continue;
    matched.sort((a, b) => (specificity(a.chain) - specificity(b.chain)) || (a.order - b.order));
    const style = {};
    for(const r of matched) for(const kv of r.decls) style[kv[0]] = kv[1];
    let styleStr = Object.keys(style).map(k => k + ': ' + style[k]).join('; ');
    const existing = el.getAttribute('style');
    if(existing) styleStr = styleStr ? styleStr + '; ' + existing : existing;
    if(styleStr) el.setAttribute('style', styleStr);
  }
  // 第二遍才删 class：先删会让 .wx strong 这类后代选择器匹配不到祖先
  for(const el of els) el.removeAttribute('class');
}

// 把裸露的中文文本节点包进 <span leaf="">：公众号编辑器粘贴后样式不丢失（gzh-design 校验规则）
// 代码区（pre/code）不动；已在 leaf span 内的不动
function wrapLeafSpans(root){
  const CJK = /[一-鿿㐀-䶿]/;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      if(!CJK.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
      let p = node.parentElement;
      while(p && p !== root){
        if(p.tagName === 'SPAN' && p.hasAttribute('leaf')) return NodeFilter.FILTER_REJECT;
        if(/^(PRE|CODE|STYLE|SCRIPT)$/.test(p.tagName)) return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const node of nodes){
    const span = document.createElement('span');
    span.setAttribute('leaf', '');
    node.parentNode.insertBefore(span, node);
    span.appendChild(node);
  }
}

let lastHtml = '';
const fileUrls = {}; // filename -> blob url
function convertNow(){
  const md = document.getElementById('md').value;
  const themeKey = document.getElementById('theme').value;
  const furniture = document.getElementById('furniture').checked;
  h2Counter = 0;
  const bodyHtml = mdParser.parse(applyMarkSyntax(md));
  const inner = furniture ? BRAND_BAR + bodyHtml + SIGN_OFF : bodyHtml;
  const holder = document.createElement('div');
  holder.innerHTML = '<section class="wx">' + inner + '</section>';
  const section = holder.firstElementChild;
  inlineStyles(section, THEMES[themeKey].css);
  wrapLeafSpans(section);
  lastHtml = section.outerHTML;
  // 预览：图片换成本地文件 blob（若已选择），复制时仍用原文件名
  const preview = document.getElementById('preview');
  preview.innerHTML = lastHtml;
  preview.querySelectorAll('img').forEach(img => {
    const base = (img.getAttribute('src') || '').split('/').pop();
    if(fileUrls[base]) img.src = fileUrls[base];
  });
  renderStrip(md);
  document.getElementById('status').textContent = '已生成 · 主题：' + THEMES[themeKey].name;
}
function mdImages(md){
  const out = []; const re = /!\[[^\]]*\]\(([^)\s]+)\)/g; let m;
  while((m = re.exec(md))) out.push(m[1]);
  return out;
}
function renderStrip(md){
  const strip = document.getElementById('strip');
  const imgs = mdImages(md);
  if(!imgs.length){ strip.innerHTML = '<p class="hint">这篇没有图片引用。</p>'; return; }
  strip.innerHTML = imgs.map((src, i) => {
    const base = src.split('/').pop();
    const url = fileUrls[base];
    return '<div class="cell">' +
      '<div class="num">' + String(i + 1).padStart(2, '0') + '</div>' +
      (url ? '<img src="' + url + '">' : '<div class="missing">未选图<br>' + base + '</div>') +
      '<div class="fname">' + base + '</div>' +
      (url ? '<a href="' + url + '" download="' + base + '">下载这张</a>' : '') +
      '</div>';
  }).join('');
}
async function copyHtml(){
  if(!lastHtml){ alert('先点“生成预览”'); return; }
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([lastHtml], { type: 'text/html' }),
      'text/plain': new Blob([lastHtml], { type: 'text/plain' }),
    })]);
    document.getElementById('status').textContent = '✅ 已复制，去公众号编辑器粘贴即可（图片按下方编号顺序上传）';
    return;
  } catch(e) { /* 落到兜底 */ }
  const div = document.createElement('div');
  div.innerHTML = lastHtml;
  div.style.cssText = 'position:fixed;left:-9999px;top:0;width:600px';
  document.body.appendChild(div);
  const range = document.createRange(); range.selectNodeContents(div);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  const ok = document.execCommand('copy');
  sel.removeAllRanges(); div.remove();
  document.getElementById('status').textContent = ok ? '✅ 已复制，去公众号编辑器粘贴即可（图片按下方编号顺序上传）' : '❌ 复制失败，请在预览区全选后手动 Ctrl+C';
}
document.getElementById('gen').addEventListener('click', convertNow);
document.getElementById('copy').addEventListener('click', copyHtml);
document.getElementById('files').addEventListener('change', (e) => {
  for(const f of e.target.files) fileUrls[f.name] = URL.createObjectURL(f);
  if(document.getElementById('md').value) convertNow();
});
