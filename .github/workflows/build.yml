name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:           # 手动触发

# 防止并发
concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. 采集数据（无论 push 还是定时，都生成最新数据） ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Run data collection
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python scripts/dashboard_v4.py

      - name: Run Top10 summarizer (AI摘要/评分/推荐理由)
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL || 'https://api.agnes-ai.cn/v1' }}
          AGNES_MODEL: ${{ secrets.AGNES_MODEL || 'agnes-3.0-flash' }}
        run: |
          python scripts/summarize_top10.py --date $(TZ='Asia/Shanghai' date +%Y-%m-%d) || echo "summarizer failed, continuing"

      - name: Run processor for V2 data
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL || 'https://api.agnes-ai.cn/v1' }}
          AGNES_MODEL: ${{ secrets.AGNES_MODEL || 'agnes-3.0-flash' }}
        run: |
          python scripts/intel_officer_processor.py \
            --date $(TZ='Asia/Shanghai' date +%Y-%m-%d) \
            --input public/data/daily-$(TZ='Asia/Shanghai' date +%Y-%m-%d).json \
            --output public/data/v2

      # ── 先提交数据，确保构建使用最新数据 ──
      # 注意：push会触发新workflow，但由于concurrency取消机制，只保留最新一次
      - name: Commit daily data
        run: |
          git config user.name "intel-daily-bot"
          git config user.email "bot@dianda.dpdns.org"
          git add -A src/data/ public/data/
          git diff --cached --quiet || git commit -m "auto: daily data $(date +%Y-%m-%d)"
          git push || echo "Push skipped (likely recursion prevention)"

      # ── 构建并部署 ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node deps & build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npm install
          npm run build
          npx wrangler pages deploy dist/ --project-name=intel-daily-astro --branch=main

      # ── 新词监测（可选，失败不影响主线）──
      - name: Run new terms detection
        continue-on-error: true
        run: |
          python scripts/new_terms.py --date $(TZ='Asia/Shanghai' date +%Y-%m-%d) || echo "New terms detection failed, continuing"

      # ── 清理旧数据（保留最近7天）──
      - name: Clean up old data (>7 days)
        run: python scripts/cleanup_data.py
